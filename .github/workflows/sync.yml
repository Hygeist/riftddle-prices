name: Sync store prices

on:
  schedule:
    - cron: '17 0-11 * * *'
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: node sync.mjs
      # A Movers problem must not stop store prices publishing. The site falls back to its own copy if movers.json is missing.
      - name: Rank Movers
        continue-on-error: true
        run: |
          node movers/snapshot.mjs
          curl -fsS -A 'RiftRiddlePriceCheck/1.0 (+https://riftddle.com)' -o "$RUNNER_TEMP/cards.json" https://riftddle.1cshen.workers.dev/data/cards.json
          node movers/movers.mjs movers/price-history.jsonl "$RUNNER_TEMP/cards.json" site/movers.json
      - name: Save the day's prices
        run: |
          git add history movers
          if ! git diff --cached --quiet; then
            git config user.name 'riftddle-prices'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m "History: $(date -u +%F)"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
