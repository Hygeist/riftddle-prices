name: Sync store prices

on:
  schedule:
    - cron: '17 0-11 * * *'
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: node sync.mjs
      # A Movers problem must not stop store prices publishing. The site falls back to its own copy if movers.json is missing.
      - name: Rank Movers
        continue-on-error: true
        run: |
          node movers/snapshot.mjs
          curl -fsS -A 'RiftRiddlePriceCheck/1.0 (+https://riftddle.com)' -o "$RUNNER_TEMP/cards.json" https://riftddle.1cshen.workers.dev/data/cards.json
          node movers/movers.mjs movers/price-history.jsonl "$RUNNER_TEMP/cards.json" site/movers.json
      # Asks zero.gg once a week. A problem here keeps the last report and must not stop the rest publishing.
      - name: Update the Meta report
        continue-on-error: true
        run: node meta/report.mjs
      # Adds the top 8 of each newly finished main event to the player history (every set, never reset). A problem here keeps the last history.
      - name: Update player history
        continue-on-error: true
        run: node meta/players.mjs
      # Writes a News tile for each event in the report, using the card data the Movers step fetched. A problem here keeps the last tiles.
      - name: Update tournament news
        continue-on-error: true
        run: node meta/tournament-news.mjs "$RUNNER_TEMP/cards.json"
      # Asks TopDeck.gg once a day. A problem here keeps the last lists.
      - name: Update tournament decks
        continue-on-error: true
        run: node meta/decks.mjs
        env:
          TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
      # Asks Riot's news page once a day. A problem here keeps the last headlines.
      - name: Update Riot news
        continue-on-error: true
        run: node meta/news.mjs
      - name: Save the day's prices
        run: |
          git add history movers meta
          if ! git diff --cached --quiet; then
            git config user.name 'riftddle-prices'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m "History: $(date -u +%F)"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
